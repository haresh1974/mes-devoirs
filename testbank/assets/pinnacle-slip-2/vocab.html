let cur=0,eng=true;
const h=location.hash.slice(1);const hi=LET.findIndex(l=>l.id===h);if(hi>=0)cur=hi;
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain(t).replace(/’/g,"'"));u.lang='fr-FR';u.rate=.85;const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function row(fr,en,ex,kind,col,cls){const e=ex[fr]||['',''];return `<div class="row ${cls||''}" style="border-left-color:${col}" data-s="${esc((fr+' '+en+' '+plain(e[0])+' '+e[1]).toLowerCase())}"><button class="say" type="button" data-t="${esc(e[0])}" aria-label="Listen">🔊</button><span class="t" style="color:${col}">${kind}</span><span class="w">${esc(fr)}</span> <span class="m">= ${esc(en)}</span><div class="s">${hl(e[0])}</div><div class="e">(${esc(e[1])})</div></div>`}
function draw(){
 const L=LET[cur],ex=L.ex;let o=`<h2 style="margin:14px 0 0">${esc(L.title)}</h2>`;
 L.paras.forEach((p,pi)=>{o+=`<div class="sec" style="color:${PC[pi]}">Paragraph ${pi+1} · ${esc(p.t)} <small style="color:var(--soft);font-weight:600">${esc(p.w)} · ${esc(p.tense)}</small></div>`;
  p.ideas.forEach(i=>{o+=`<div class="idea">${i.e} ${esc(i.t)} <small>(${esc(i.tn)})</small></div>`;
   i.w.forEach((g,c)=>g.forEach(w=>{o+=row(w[0],w[1],ex,CT[c],CC[c])}))})});
 o+=`<div class="sec">Connectives toolkit</div>`;L.conn.forEach(r=>{o+=`<div class="idea"><small>${esc(r[0])}</small></div>`;r[1].forEach(w=>{o+=row(w[0],w[1],ex,'connective','var(--ink)')})});
 o+=`<div class="sec">Boosters (extra marks)</div>`;L.boost.forEach(b=>{o+=row((b[4]?'★ ':'')+b[0],b[1]+' · '+b[2],{[(b[4]?'★ ':'')+b[0]]:ex[b[0]]},'booster','var(--p3)')});
 o+=`<div class="sec">Idioms</div>`;L.idioms.forEach(x=>{const pi=+x[3].slice(1)-1;o+=`<div class="row idi" style="border-left-color:${PC[pi]}" data-s="${esc((x[0]+' '+x[1]+' '+x[2]+' '+plain(x[4])+' '+x[5]).toLowerCase())}"><button class="say" type="button" data-t="${esc(x[4])}" aria-label="Listen">🔊</button><span class="t" style="color:${PC[pi]}">${esc(x[3])} · idiom</span><span class="w">${esc(x[0])}</span><div class="m">word for word: ${esc(x[1])}</div><div class="m" style="color:${PC[pi]}">= ${esc(x[2])}</div><div class="s">${hl(x[4])}</div><div class="e">(${esc(x[5])})</div></div>`});
 $('app').innerHTML=o;$('app').classList.toggle('hideen',!eng);
 $('app').querySelectorAll('.say').forEach(b=>b.onclick=ev=>{ev.stopPropagation();say(b.dataset.t)});
 $('app').querySelectorAll('.row').forEach(r=>r.onclick=()=>r.classList.toggle('rev'));filter()}
function filter(){const q=$('q').value.trim().toLowerCase();let n=0,tot=0;document.querySelectorAll('#app .row').forEach(r=>{tot++;const ok=!q||r.dataset.s.includes(q);r.style.display=ok?'':'none';if(ok)n++});
 document.querySelectorAll('#app .idea,#app .sec').forEach(s=>{if(!q){s.style.display='';return}let x=s.nextElementSibling,any=false;while(x&&!x.classList.contains('sec')&&!(s.classList.contains('idea')&&x.classList.contains('idea'))){if(x.classList.contains('row')&&x.style.display!=='none')any=true;x=x.nextElementSibling}s.style.display=any?'':'none'});
 $('cnt').textContent=q?n+' of '+tot+' shown':tot+' words'}
function tabs(){$('tabs').innerHTML=LET.map((l,i)=>`<button type="button" class="${i===cur?'on':''}" data-i="${i}">${esc(l.tab)}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;history.replaceState(null,'','#'+LET[cur].id);tabs();draw()})}
$('q').oninput=filter;$('eng').onclick=()=>{eng=!eng;$('eng').textContent=eng?'English: shown':'English: tap a row to reveal';$('app').classList.toggle('hideen',!eng)};
tabs();draw();
</script></body></html>
