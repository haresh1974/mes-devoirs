<style>
/* Layout: one big mind-map stage that scales to the screen; click an idea to burst its vocabulary out around it. */
:root{--bg:#F4F7FB;--ink:#16254A;--soft:#5B6B8C;--card:#FFFFFF;--line:#D5DDEB;

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh;
background-image:radial-gradient(#CBD5E6 1.2px,transparent 1.2px);background-size:26px 26px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;max-width:1400px;margin:0 auto 10px}
.brand{font-family:var(--disp);font-weight:800;font-size:22px;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:12px;color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:700 14px var(--body);color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:hover{transform:translateY(-1px)}button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--p3);outline-offset:2px}
button.on{background:var(--ink);color:#fff}
#fit{max-width:1400px;margin:0 auto;position:relative;width:100%}
#stage{position:absolute;left:0;top:0;width:1400px;height:880px;transform-origin:0 0}
svg.lines{position:absolute;left:0;top:0;width:1400px;height:880px;pointer-events:none;overflow:visible}
.node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:0}
.hub{background:var(--hub);color:#fff;border-radius:50%;box-shadow:0 10px 0 rgba(22,37,74,.18),0 0 0 10px rgba(22,37,74,.08)}
.hub .em{font-size:64px;line-height:1}.hub .tt{font:800 24px/1.1 var(--disp);padding:0 24px;margin-top:6px}
.hub .sub{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-top:6px}
.hub .tn{font:700 13px var(--body);margin-top:8px;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 12px}
.idea{width:176px;height:108px;border-radius:26px;color:#fff;cursor:pointer;padding:6px 10px;box-shadow:0 6px 0 rgba(0,0,0,.18);font-family:var(--body);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.idea:hover{transform:scale(1.07) rotate(-1deg)}.idea:focus-visible{outline:4px solid var(--ink)}
.idea .em{font-size:36px;line-height:1.05}.idea .t{font:800 14px/1.15 var(--body);margin-top:3px}
.idea .n{position:absolute;top:-10px;left:-8px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:999px;font:800 12px var(--body);padding:1px 8px}
.dim{opacity:.18;filter:grayscale(.6)}
.cat{width:132px;height:132px;border-radius:50%;color:#fff;font:800 19px/1.05 var(--disp);box-shadow:0 6px 0 rgba(0,0,0,.2);animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.cat small{font:700 11px var(--body);opacity:.85;margin-top:3px;letter-spacing:.04em}
.chip{position:absolute;width:290px;height:56px;background:var(--card);border-radius:16px;border:3px solid;padding:5px 12px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;text-align:left;font-family:var(--body);animation:slide .45s ease both;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.chip b{font:800 17px/1.15 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{font:700 13px/1.2 var(--body);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .15s}
.hide .chip:not(.rev) span{opacity:0}.hide .chip:not(.rev) b::after{content:"  · tap";color:var(--soft);font-weight:700;font-size:12px}
.crumb{position:absolute;left:0;right:0;top:6px;text-align:center;font:800 15px var(--body);letter-spacing:.05em;text-transform:uppercase}
.nav{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:10px}
.legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1400px;margin:10px auto 0}
.lg{color:#fff;border-radius:18px;padding:8px 16px;font:800 14px/1.25 var(--body);cursor:pointer;border:0;box-shadow:0 4px 0 rgba(0,0,0,.2);text-align:left}
.lg small{display:block;font-weight:700;opacity:.9;font-size:12px}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.ln{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw .8s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.idea,.cat,.chip{animation:none}.ln{animation:none;stroke-dashoffset:0}}
.sheet,.panel{max-width:1100px;margin:0 auto}
.pcard{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:16px 18px;margin-bottom:18px}
.pcard h2{font:800 22px var(--disp);margin:0 0 4px}.pcard .tn{font-weight:800;font-size:14px;margin-bottom:10px}
.icard{border-top:2px dashed var(--line);padding:12px 0}.icard h3{font:800 18px var(--body);margin:0 0 8px}

.cols h4{margin:0 0 4px;font:800 13px var(--body);letter-spacing:.05em;text-transform:uppercase}
.cols p{margin:0;font-size:14px;line-height:1.55}.cols p i{font-style:normal;color:var(--soft)}
table{border-collapse:collapse;width:100%;background:var(--card);border:3px solid var(--ink);border-radius:16px;overflow:hidden}
td,th{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:2px solid var(--line);font-size:15px;line-height:1.5}
th{background:var(--ink);color:#fff;font-weight:800}td:first-child{font-weight:800;white-space:nowrap}
.tw{overflow-x:auto}
.w{display:inline-block;margin:2px 6px 2px 0;padding:1px 7px;border-radius:10px;border:1.5px dashed transparent;cursor:pointer}.w:hover,.w:focus-visible{background:#EAF1FB;border-color:var(--noun);outline:none}.w i{font-style:normal;color:var(--soft)}.w.sel{background:#FFF3CC;border-color:var(--adj)}
.hint{max-width:1400px;margin:0 auto 8px;color:var(--soft);font-weight:700;font-size:14px}
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(720px,calc(100% - 24px));background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:0 12px 40px rgba(22,37,74,.35);padding:14px 18px 14px;z-index:50}
.pop .x{position:absolute;right:8px;top:6px;border:0;box-shadow:none;background:transparent;font-size:26px;line-height:1;padding:2px 10px}
.pop .pw{font:800 22px var(--disp);padding-right:36px}.pop .pw span{font:700 16px var(--body);color:var(--soft)}
.pop .pk{display:inline-block;font:800 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--noun);border-radius:999px;padding:1px 9px;margin-bottom:6px}
.pop .ps{font:700 19px/1.45 var(--body);margin-top:8px}.pop .ps b{background:#FFE9A6;border-radius:6px;padding:0 3px}
.pop .pe{font:700 16px/1.4 var(--body);color:var(--soft);margin-top:4px}
.pop .say{margin-top:8px;font-size:13px;padding:4px 12px}
.idi{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.ic{background:var(--card);border:3px solid;border-radius:20px;padding:14px 16px}
.ic h3{font:800 20px/1.2 var(--disp);margin:0 0 4px}.ic .lit{font-size:14px;color:var(--soft);font-weight:700}
.ic .mean{font:800 16px var(--body);margin:6px 0}.ic .ex{font:700 17px/1.45 var(--body);margin-top:8px;padding-top:8px;border-top:2px dashed var(--line)}.ic .ex b{background:#FFE9A6;border-radius:6px;padding:0 3px}
.ic .en{color:var(--soft);font-weight:700;font-size:15px}.ic .pp{float:right;font:800 11px var(--body);color:#fff;border-radius:999px;padding:2px 10px}
.exc{font-size:14.5px;line-height:1.4}.exc b{background:#FFE9A6;border-radius:5px;padding:0 3px}.exc .en{display:block;color:var(--soft)}
</style>

"À la maison, [[je tourne en rond]].", "At home, I go round in circles."]]};
const PC=['var(--p1)','var(--p2)','var(--p3)'];
const CC=['var(--verb)','var(--noun)','var(--adj)','var(--adv)'];
const CN=['Verbs','Nouns','Adjectives','Adverbs & links'];
const CS=['actions','things','describing','how · when · links'];
const EX=D.ex||{};
const hl=t=>esc(t).replace(/\[\[(.*?)\]\]/g,'<b>$1</b>');
const plain=t=>t.replace(/\[\[|\]\]/g,'');
let popEl=null;const canSay='speechSynthesis' in window;if(!canSay)document.getElementById('pops2').style.display='none';
function openPop(k,fr,en,kind){const e=EX[k];const p=document.getElementById('pop');
 document.getElementById('popk').textContent=kind||'word';document.getElementById('popw').innerHTML=esc(fr)+' <span>= '+esc(en)+'</span>';
 if(e){document.getElementById('pops').innerHTML=hl(e[0]);document.getElementById('pope').textContent='('+e[1]+')';document.getElementById('pops2').onclick=()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain(e[0]).replace(/’/g,"'"));u.lang='fr-FR';u.rate=.85;const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(_){}}}
 else{document.getElementById('pops').textContent='';document.getElementById('pope').textContent=''}
 p.hidden=false}
function closePop(){document.getElementById('pop').hidden=true;if(popEl){popEl.classList.remove('sel');popEl=null}try{speechSynthesis.cancel()}catch(_){}}
document.getElementById('popx').onclick=closePop;
document.addEventListener('click',e=>{if(!e.target.closest('#pop')&&!e.target.closest('.w')&&!e.target.closest('.chip')&&!e.target.closest('.bw'))closePop()});
function bindW(root){root.querySelectorAll('.w').forEach(w=>{const go=()=>{if(popEl)popEl.classList.remove('sel');popEl=w;w.classList.add('sel');openPop(w.dataset.k,w.dataset.k,w.dataset.e,w.dataset.kind)};w.onclick=go;w.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go()}}})}
const IDEAS=[];D.paras.forEach((p,pi)=>p.ideas.forEach((i,ii)=>IDEAS.push({...i,pi,ii,n:IDEAS.length+1})));
let view='map',eng=true,focusP=-1;
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function fit(){const f=$('#fit');if(!f)return;const k=Math.min(1,f.clientWidth/1400);$('#stage').style.transform='scale('+k+')';f.style.height=(880*k)+'px'}
window.addEventListener('resize',fit);
function setBtns(){['Map','Sheet','Conn','Boost','Idi'].forEach(k=>$('#b'+k).classList.remove('on'));
 const m=view==='map'||typeof view==='number'?'Map':view==='sheet'?'Sheet':view==='conn'?'Conn':view==='idi'?'Idi':'Boost';$('#b'+m).classList.add('on');
 $('#bEng').textContent=eng?'English: shown':'English: tap to reveal'}
function rectEdge(cx,cy,w,h,dx,dy){const s=Math.min(Math.abs(w/2/(dx||1e-9)),Math.abs(h/2/(dy||1e-9)));return[cx+dx*s,cy+dy*s]}
function arrowSVG(x1,y1,x2,y2,col,bend){const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1;
 const cx=mx-dy/l*bend,cy=my+dx/l*bend;return `<path class="ln" d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/>`}
function defs(){return `<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>`}
function renderMap(){
 const cx=700,cy=430,R=125,n=IDEAS.length;let L='',N='';
 IDEAS.forEach((it,k)=>{const a=(-90+(k+.5)*360/n)*Math.PI/180;const x=cx+Math.cos(a)*575,y=cy+Math.sin(a)*345;
  const dx=Math.cos(a),dy=Math.sin(a);const [sx,sy]=[cx+dx*(R+8),cy+dy*(R+8)];
  const ux=x-cx,uy=y-cy,ul=Math.hypot(ux,uy);const [ex,ey]=rectEdge(x,y,176+16,108+16,-ux/ul,-uy/ul);
  const dim=focusP>=0&&focusP!==it.pi?' dim':'';
  L+=`<g class="${dim}">`+arrowSVG(sx,sy,ex,ey,PC[it.pi],18)+`</g>`;
  N+=`<button class="node idea${dim}" data-i="${k}" style="left:${x-88}px;top:${y-54}px;background:${PC[it.pi]};animation-delay:${k*50}ms" aria-label="${esc(it.t)}"><span class="n">${it.n}</span><span class="em">${it.e}</span><span class="t">${esc(it.t)}</span></button>`});
 const hub=`<div class="node hub" style="left:${cx-R}px;top:${cy-R}px;width:${2*R}px;height:${2*R}px"><div class="em">${D.emoji}</div><div class="tt">${esc(D.title)}</div><div class="sub">${esc(D.sub)}</div></div>`;
 const lg=D.paras.map((p,i)=>`<button class="lg" data-p="${i}" style="background:${PC[i]}">${i+1} · ${esc(p.t)} <small>⏱ ${esc(p.tense)} · ${esc(p.w)}</small></button>`).join('');
 app.innerHTML=`<div id="fit"><div id="stage"><svg class="lines">${defs()}${L}</svg>${hub}${N}</div></div><div class="legend">${lg}<button class="lg" data-p="-1" style="background:var(--ink)">Show all <small>click a colour to focus</small></button></div>`;
 fit();setTimeout(fit,50);
 app.querySelectorAll('.idea').forEach(b=>b.onclick=()=>{view=+b.dataset.i;render()});
 app.querySelectorAll('.lg').forEach(b=>b.onclick=()=>{focusP=+b.dataset.p===focusP?-1:+b.dataset.p;renderMap()});
}
function renderDetail(k){
 const it=IDEAS[k],p=D.paras[it.pi],cx=700,cy=440,R=120;let L='',N='';
 const cats=[[430,215,24,'left'],[970,215,1086,'right'],[430,665,24,'left'],[970,665,1086,'right']];
 const baseY=[24,24,462,462];
 it.w.forEach((words,c)=>{const [bx,by,chx,side]=cats[c];
  const ux=bx-cx,uy=by-cy,ul=Math.hypot(ux,uy);
  L+=arrowSVG(cx+ux/ul*(R+6),cy+uy/ul*(R+6),bx-ux/ul*72,by-uy/ul*72,CC[c],c%2?-24:24);
  words.forEach((w,j)=>{const y=baseY[c]+j*63;const ex=side==='left'?chx+290:chx;const ey=y+28;const sx=side==='left'?bx-60:bx+60;
   L+=`<line class="ln" x1="${sx}" y1="${by}" x2="${ex}" y2="${ey}" stroke="${CC[c]}" stroke-width="3" stroke-linecap="round" style="animation-delay:${.2+j*.05}s"/>`;
   N+=`<div class="chip" tabindex="0" role="button" data-k="${esc(w[0])}" data-e="${esc(w[1])}" data-c="${c}" title="${esc(w[0]+' = '+w[1])}" style="left:${chx}px;top:${y}px;border-color:${CC[c]};animation-delay:${.15+j*.06}s"><b>${esc(w[0])}</b><span>${esc(w[1])}</span></div>`});
  N+=`<div class="node cat" style="left:${bx-66}px;top:${by-66}px;background:${CC[c]};animation-delay:${c*70}ms">${CN[c]}<small>${CS[c]}</small></div>`});
 const hub=`<div class="node hub" style="left:${cx-R}px;top:${cy-R}px;width:${2*R}px;height:${2*R}px"><div class="em">${it.e}</div><div class="tt" style="font-size:22px">${esc(it.t)}</div><div class="tn">⏱ ${esc(it.tn)}</div></div>`;
 app.innerHTML=`<div id="fit" class="${eng?'':'hide'}"><div id="stage"><div class="crumb" style="color:${PC[it.pi]}">Paragraph ${it.pi+1} · ${esc(p.t)} · idea ${it.ii+1} of ${p.ideas.length}</div><svg class="lines">${defs()}${L}</svg>${hub}${N}
 <div class="nav"><button id="pv">◀ Previous</button><button id="bk">All ideas</button><button id="nx">Next ▶</button></div></div></div>`;
 fit();setTimeout(fit,50);
 $('#pv').onclick=()=>{view=(k+IDEAS.length-1)%IDEAS.length;render()};$('#nx').onclick=()=>{view=(k+1)%IDEAS.length;render()};$('#bk').onclick=()=>{view='map';render()};
 app.querySelectorAll('.chip').forEach(c=>{const go=()=>{c.classList.add('rev');openPop(c.dataset.k,c.dataset.k,c.dataset.e,CN[+c.dataset.c].replace(/s$/,'').replace('Adverbs & link','adverb / link'))};c.onclick=go;c.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go()}}});
}
function pairs(a,kind){return a.map(w=>`<span class="w" tabindex="0" role="button" data-k="${esc(w[0])}" data-e="${esc(w[1])}" data-kind="${kind||'word'}"><b>${esc(w[0])}</b> <i>= ${esc(w[1])}</i></span>`).join('')}
function renderSheet(){
 app.innerHTML='<div class="sheet">'+D.paras.map((p,pi)=>`<div class="pcard" style="border-color:${PC[pi]}"><h2 style="color:${PC[pi]}">Paragraph ${pi+1} · ${esc(p.t)} <small style="color:var(--soft);font-size:14px">${esc(p.w)}</small></h2><div class="tn">⏱ ${esc(p.tense)}</div>`+
  p.ideas.map(i=>`<div class="icard"><h3>${i.e} ${esc(i.t)} <small style="color:var(--soft)">(${esc(i.tn)})</small></h3><div class="cols">`+i.w.map((w,c)=>`<div><h4 style="color:${CC[c]}">${CN[c]}</h4><p>${pairs(w,['verb','noun','adjective','adverb / link'][c])}</p></div>`).join('')+`</div></div>`).join('')+`</div>`).join('')+'</div>';
 bindW(app)}
function renderConn(){app.innerHTML=`<div class="panel"><div class="pcard"><h2>Connectives toolkit</h2><p style="margin:0 0 10px;color:var(--soft)">Tap a connective to see it in a sentence from this letter.</p><div class="tw"><table><tr><th>Use for</th><th>French = English</th></tr>${D.conn.map(r=>`<tr><td>${esc(r[0])}</td><td>${pairs(r[1],'connective')}</td></tr>`).join('')}</table></div></div></div>`;bindW(app)}
function renderBoost(){app.innerHTML=`<div class="panel"><div class="pcard"><h2>Boosters: pick 2 or 3</h2><p style="margin:0 0 10px;color:var(--soft)">Build your own sentence from the pattern. ★ marks the easiest to start with.</p><div class="tw"><table><tr><th>Booster</th><th>Means</th><th>Pattern</th><th>Use it in</th><th>Example</th></tr>${D.boost.map(b=>{const e=EX[b[0]];return `<tr><td>${b[4]?'★ ':''}${esc(b[0])}</td><td>${esc(b[1])}</td><td>${esc(b[2])}</td><td>${esc(b[3])}</td><td class="exc">${e?hl(e[0])+'<span class="en">('+esc(e[1])+')</span>':''}</td></tr>`}).join('')}</table></div></div></div>`}
function renderIdi(){const I=D.idioms||[];
 app.innerHTML=`<div class="panel"><div class="pcard"><h2>Idioms for this letter</h2><p style="margin:0 0 12px;color:var(--soft)">An idiom does not mean what the words say. Learn the real meaning, then use one or two in your letter to earn extra marks. Each one shows where it fits.</p><div class="idi">`+I.map(x=>{const pi=+x[3].replace('P','')-1;return `<div class="ic" style="border-color:${PC[pi]}"><span class="pp" style="background:${PC[pi]}">${esc(x[3])} · ${esc(D.paras[pi].t)}</span><h3>${esc(x[0])}</h3><div class="lit">word for word: ${esc(x[1])}</div><div class="mean" style="color:${PC[pi]}">= ${esc(x[2])}</div><div class="ex">${hl(x[4])}<div class="en">(${esc(x[5])})</div></div></div>`}).join('')+`</div></div></div>`}
function render(){closePop();setBtns();if(view==='map')renderMap();else if(typeof view==='number')renderDetail(view);else if(view==='sheet')renderSheet();else if(view==='conn')renderConn();else if(view==='idi')renderIdi();else renderBoost()}
$('#bMap').onclick=()=>{view='map';render()};$('#bSheet').onclick=()=>{view='sheet';render()};$('#bConn').onclick=()=>{view='conn';render()};$('#bBoost').onclick=()=>{view='boost';render()};$('#bIdi').onclick=()=>{view='idi';render()};
$('#bEng').onclick=()=>{eng=!eng;render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('pop').hidden){closePop();return}if(typeof view==='number'){if(e.key==='ArrowRight'){view=(view+1)%IDEAS.length;render()}if(e.key==='ArrowLeft'){view=(view+IDEAS.length-1)%IDEAS.length;render()}if(e.key==='Escape'){view='map';render()}}});
render();
</script>
