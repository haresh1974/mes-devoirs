<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resources · French with Haresh</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#18264a;--blue:#2e4fc4;--mute:#56627f;--line:#d6ddee;--green:#17804f}
@media (prefers-color-scheme:dark){:root{--bg:#121a33;--card:#172038;--ink:#eef1fb;--blue:#8aa4ff;--mute:#9aa6c4;--line:#2a3556;--green:#55d696}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(94vw,860px);margin:0 auto;padding:20px 0 120px}
a.back{color:var(--blue);text-decoration:none;font-weight:800}
h1{font-size:1.7rem;margin:8px 0 4px}p.lead{margin:0 0 16px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sec{margin:28px 0 8px;display:flex;align-items:center;gap:10px}.sec h2{margin:0;font-size:1.15rem}.sec small{color:var(--mute)}
.pill{display:inline-block;font-size:.72rem;font-weight:800;border-radius:999px;padding:2px 9px}.p-both{background:#e1f5ea;color:#17804f}.p-ICSE{background:#e4ebff;color:#2e4fc4}.p-IGCSE{background:#fde8d8;color:#b4570d}.p-priv{background:#f1e6ff;color:#6b3fc4}
details{background:var(--card);border:2px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
summary{cursor:pointer;padding:14px 16px;font-weight:800;display:flex;align-items:center;gap:10px;list-style:none}summary::-webkit-details-marker{display:none}
summary .n{margin-left:auto;color:var(--mute);font-weight:600;font-size:.9rem}
summary:before{content:"▸";transition:.15s}details[open] summary:before{transform:rotate(90deg)}
.row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line)}
.row .t{flex:1;min-width:0}.row .t b{display:block}.row .t span{display:block;color:var(--mute);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row a.go{font-weight:800;color:var(--blue);text-decoration:none;white-space:nowrap}.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:12px;display:none;justify-content:center;gap:12px;align-items:center;z-index:5}.bar.on{display:flex}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer}.btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.modal{position:fixed;inset:0;background:rgba(10,15,35,.55);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}.modal.on{display:flex}
.box{background:var(--card);border-radius:18px;padding:22px;width:min(94vw,460px);max-height:90vh;overflow:auto}.box h2{margin:0 0 10px}
.box label.l{display:block;font-weight:800;margin:14px 0 6px}.box input[type=datetime-local]{width:100%;padding:10px;border-radius:10px;border:2px solid var(--line);font:inherit;background:var(--bg);color:var(--ink)}
.cls{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.cls input{width:20px;height:20px;accent-color:var(--blue)}
.err{color:#c42f3f;font-weight:700;min-height:20px;margin-top:8px}.empty{color:var(--mute);padding:30px 0;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:2px solid var(--line);border-left:6px solid var(--blue);border-radius:16px;padding:14px 16px;font:inherit;color:var(--ink);cursor:pointer}
.tile:hover{border-color:var(--blue)}.tile.t-ICSE{border-left-color:#2e4fc4}.tile.t-IGCSE{border-left-color:#d9772b}.tile.t-both{border-left-color:#17804f}
.tile .ic{font-size:1.6rem;line-height:1}.tile b{font-size:1.05rem}.tile span.d{color:var(--mute);font-size:.88rem}.tile .ct{margin-top:auto;font-weight:800;color:var(--blue);font-size:.9rem}
.srch{width:100%;padding:11px 14px;border-radius:12px;border:2px solid var(--line);font:inherit;background:var(--card);color:var(--ink);margin:6px 0 4px}
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 4px}.crumb h2{margin:0;font-size:1.3rem}.crumb .sel{margin-left:auto}
.cname{margin:22px 0 4px;font-size:1.1rem;display:flex;align-items:center;gap:8px}
</style></head><body><main>
<a class="back" id="back" href="/">← French with Haresh</a>
<h1>📎 Resources</h1>
<p class="lead" id="lead">Loading…</p>
<input class="srch" id="q" type="search" placeholder="Search all resources (for example: shopping, 2023, passage 12)">
<div id="list"></div>
</main>
<div class="bar" id="bar"><b id="cnt"></b><button class="btn ghost" id="clr">Clear</button><button class="btn" id="asg">Assign as homework…</button></div>
<div class="modal" id="mod"><div class="box"><h2>Assign as homework</h2><div id="mres" style="color:var(--mute)"></div>
<label class="l">Classes</label><div id="mcls"></div>
<label class="l">Start</label><input type="datetime-local" id="ms"><label class="l">Due (optional)</label><input type="datetime-local" id="md">
<div class="err" id="merr"></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px"><button class="btn ghost" id="mx">Cancel</button><button class="btn" id="mok">Assign</button></div></div></div>
<div class="modal" id="mod2"><div class="box"><h2 id="mod2t"></h2><div id="mod2l"></div><div style="text-align:right;margin-top:12px"><button class="btn ghost" onclick="document.getElementById('mod2').classList.remove('on')">Close</button></div></div></div>
<script>
const $=(s)=>document.querySelector(s),esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,cur=null,q='',sel=new Set();
const kind=(r)=>r.boards.length>1?'both':r.boards[0];
const pill=(k)=>'<span class="pill p-'+k+'">'+(k==='both'?'ICSE + IGCSE':k)+'</span>';
const yr=(r)=>{const m=r.title.match(/(\d{4})/);return m?m[1]:'Other'};
const rcSub=(r)=>{const d=r.desc||'';if(/\(\d{4}( \(official\))?\)\./.test(d))return 'Board papers 1995 to 2026';if(/\(Set \d+\)/.test(d))return 'Practice sets';return 'School and preliminary papers'};
const SPM={'sp-box':'Start here','sp-2':'Start here','sp-1':'Travel and transport','sp-3':'Travel and transport','sp-4':'Travel and transport','sp-5':'Communication and technology','sp-6':'Communication and technology','sp-7':'Communication and technology','sp-8':'Communication and technology','sp-10':'Education'};
const spSub=(r)=>SPM[r.id]||'Nature and environment';
const strip=(r)=>r.group.replace(/^[^:]+: /,'');
const COLLS=[
 {k:'dial',ic:'💬',t:'Speaking dialogues',d:'Role-play dialogues sorted by topic.',test:(r)=>r.group.indexOf('ICSE dialogues')===0,sub:strip},
 {k:'rc',ic:'📖',t:'Reading comprehension',d:'Passages with questions, from board and school papers.',test:(r)=>r.group==='Reading comprehension (ICSE)',sub:rcSub,order:['Board papers 1995 to 2026','Practice sets','School and preliminary papers']},
 {k:'gr',ic:'✏️',t:'Grammar tests',d:'Slip tests, practice sheets and full 40-mark tests.',test:(r)=>r.group.indexOf('Grammar tests')===0,sub:strip,order:['Slip tests','Practice sheets','Full grammar tests (40 marks)']},
 {k:'isp',ic:'🎤',t:'Speaking practice',d:'Role plays, themes and timed speaking tests.',test:(r)=>r.group==='IGCSE speaking',sub:spSub,order:['Start here','Travel and transport','Communication and technology','Nature and environment','Education']},
 {k:'irr',ic:'📄',t:'Reading past papers',d:'Cambridge 0520 Paper 2, newest first.',test:(r)=>r.group==='IGCSE Reading',sub:yr,desc:true},
 {k:'tr',ic:'🔁',t:'Translation',d:'French to English and English to French passages.',test:(r)=>r.group.indexOf('Translation')===0,sub:strip,order:['French to English','English to French']}
];
function collHtml(x,all,open0){
  const c=x.c,subs={};x.items.forEach((r)=>{const n=c.sub(r);(subs[n]=subs[n]||[]).push(r)});
  let names=Object.keys(subs);
  if(c.order)names.sort((a,b)=>c.order.indexOf(a)-c.order.indexOf(b));
  if(c.desc)names.sort().reverse();
  const T=D.role==='teacher',ids=x.items.map((r)=>r.id);
  let h='';
  if(all)h+='<div class="cname">'+c.ic+' '+esc(c.t)+' '+pill(x.kind)+'<span class="mute" style="color:var(--mute);font-weight:600;font-size:.9rem">'+x.items.length+'</span></div>';
  names.forEach((g,i)=>{
    const items=subs[g],gi=items.map((r)=>r.id),allc=gi.every((i2)=>sel.has(i2));
    h+='<details'+((all||i===0)?' open':'')+'><summary>'+(T?'<input type="checkbox" data-g="'+esc(gi.join(','))+'" '+(allc?'checked':'')+' title="Select all in this group">':'')+esc(g)+'<span class="n">'+items.length+'</span></summary>'+
    items.map((r)=>'<div class="row">'+(T?'<input type="checkbox" data-r="'+esc(r.id)+'" '+(sel.has(r.id)?'checked':'')+'>':'')+'<div class="t"><b>'+esc(r.title)+'</b><span>'+esc(r.desc||'')+'</span></div>'+(r.access==='assigned'&&!T?'':(r.guided?(T?'<button class="btn" style="padding:6px 12px" data-a="'+esc(r.id)+'">➕ Assign</button><button class="btn ghost" style="padding:6px 10px" data-k="'+esc(r.id)+'">🔑 Students &amp; answers</button><a class="go" target="_blank" href="/tests/preview/'+esc(r.guided)+'">Preview ↗</a>':'<a class="go" href="'+esc(r.url)+'">Open ↗</a>'):'<a class="go" href="'+esc(r.url)+'">Open ↗</a>'))+(r.access==='assigned'?'<span class="pill p-priv">given by teacher</span>':'')+'</div>').join('')+'</details>';
  });
  return h;
}
function draw(){
  const T=D.role==='teacher',ql=q.trim().toLowerCase();
  const rs=D.resources.filter((r)=>!ql||(r.title+' '+(r.desc||'')+' '+r.group).toLowerCase().indexOf(ql)>-1);
  const cols=COLLS.map((c)=>{const items=rs.filter(c.test);return {c,items,kind:items.length?kind(items[0]):'both'}}).filter((x)=>x.items.length);
  const left=rs.filter((r)=>!COLLS.some((c)=>c.test(r)));
  if(left.length)cols.push({c:{k:'oth',ic:'📎',t:'Other',d:'',sub:(r)=>r.group},items:left,kind:kind(left[0])});
  let h='';
  if(!cols.length){h='<div class="empty">'+(ql?'Nothing matches that search.':'Nothing here yet.')+'</div>'}
  else if(ql){h=cols.map((x)=>collHtml(x,true)).join('')}
  else if(cur&&cols.some((x)=>x.c.k===cur)){
    const x=cols.find((y)=>y.c.k===cur);
    h='<div class="crumb"><button class="btn ghost" data-back="1">← All resources</button><h2>'+x.c.ic+' '+esc(x.c.t)+'</h2>'+pill(x.kind)+(T?'<label class="sel"><input type="checkbox" data-g="'+esc(x.items.map((r)=>r.id).join(','))+'" '+(x.items.every((r)=>sel.has(r.id))?'checked':'')+'> Select all '+x.items.length+'</label>':'')+'</div>'+collHtml(x,false,false);
  }else{
    cur=null;
    [['ICSE','ICSE','Grade 10 ICSE classes'],['IGCSE','IGCSE','Cambridge IGCSE classes'],['both','Shared','Use with every class']].forEach(([k,t,sub])=>{
      const xs=cols.filter((x)=>x.kind===k);if(!xs.length)return;
      h+='<div class="sec"><h2>'+t+'</h2><small>'+sub+'</small></div><div class="tiles">'+xs.map((x)=>'<button class="tile t-'+k+'" data-c="'+x.c.k+'"><span class="ic">'+x.c.ic+'</span><b>'+esc(x.c.t)+'</b><span class="d">'+esc(x.c.d)+'</span><span class="ct">'+x.items.length+' '+(x.items.length>1?'items':'item')+' ›</span></button>').join('')+'</div>';
    });
  }
  const keep=[...document.querySelectorAll('details')].map((d)=>d.open);
  $('#list').innerHTML=h;
  if(keep.length===document.querySelectorAll('details').length)[...document.querySelectorAll('details')].forEach((d,i)=>{d.open=keep[i]});
  const n=sel.size;$('#bar').classList.toggle('on',n>0&&T);$('#cnt').textContent=n+' selected';
}
document.addEventListener('click',(e)=>{
  const ab=e.target.closest('[data-a]');
  if(ab){sel.clear();sel.add(ab.dataset.a);draw();$('#asg').click();return}
  const kb=e.target.closest('[data-k]');
  if(kb){const l=(D.guided||{})[kb.dataset.k]||[];const r=D.resources.find((x)=>x.id===kb.dataset.k);
    $('#mod2t').textContent=r?r.title:'';
    $('#mod2l').innerHTML=l.length?l.map((c)=>'<a class="btn" style="display:block;text-decoration:none;text-align:center;margin:8px 0" href="/#/t/tests/'+esc(c.aid)+'">🔑 '+esc(c.class_name)+': students &amp; answers</a>').join(''):'<p style="color:var(--mute)">Not assigned to any class yet. Press “➕ Assign” beside this paper, and it will appear here with a switch in front of each student’s name.</p>';
    $('#mod2').classList.add('on');return}
  const tl=e.target.closest('[data-c]');if(tl){cur=tl.dataset.c;draw();scrollTo(0,0);return}
  if(e.target.closest('[data-back]')){cur=null;draw();return}
});
document.addEventListener('change',(e)=>{
  const g=e.target.dataset&&e.target.dataset.g,r=e.target.dataset&&e.target.dataset.r;
  if(g){g.split(',').forEach((i)=>e.target.checked?sel.add(i):sel.delete(i));draw()}
  if(r){e.target.checked?sel.add(r):sel.delete(r);$('#bar').classList.toggle('on',sel.size>0);$('#cnt').textContent=sel.size+' selected'}
});
$('#q').oninput=(e)=>{q=e.target.value;draw()};
$('#clr').onclick=()=>{sel.clear();draw()};
const loc=(ms)=>{const d=new Date(ms-new Date(ms).getTimezoneOffset()*60000);return d.toISOString().slice(0,16)};
$('#asg').onclick=()=>{
  const picks=D.resources.filter((r)=>sel.has(r.id));
  const need=new Set();picks.forEach((r)=>r.boards.forEach((b)=>need.add(b)));
  $('#mres').textContent=picks.length+' resource'+(picks.length>1?'s':'')+' selected';
  $('#mcls').innerHTML=D.classes.length?D.classes.map((c)=>{const fits=(c.board||'Both')==='Both'||picks.every((r)=>r.boards.includes(c.board));return '<label class="cls"><input type="checkbox" value="'+esc(c.id)+'" '+(fits?'checked':'')+'><span><b>'+esc(c.name)+'</b> <span class="pill p-'+((c.board||'Both')==='Both'?'both':c.board)+'">'+esc(c.board||'Both')+'</span>'+(fits?'':' <small style="color:var(--mute)">board differs</small>')+'</span></label>'}).join(''):'<div class="empty">Create a class first.</div>';
  $('#ms').value=loc(Date.now());$('#md').value='';$('#merr').textContent='';$('#mod').classList.add('on');
};
$('#mx').onclick=()=>$('#mod').classList.remove('on');
$('#mok').onclick=async()=>{
  const cls=[...document.querySelectorAll('#mcls input:checked')].map((i)=>i.value);
  const st=$('#ms').value?new Date($('#ms').value).getTime():Date.now(),du=$('#md').value?new Date($('#md').value).getTime():null;
  $('#merr').textContent='';
  const r=await fetch('/api/resources/assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource_ids:[...sel],class_ids:cls,start_at:st,due_at:du})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){$('#merr').textContent=j.error||'Could not assign.';return}
  $('#mod').classList.remove('on');sel.clear();draw();alert('Assigned: '+j.made+' homework task'+(j.made>1?'s':'')+' across '+j.classes+' class'+(j.classes>1?'es':'')+'. Students will see them on their home page.');location.reload();
};
fetch('/api/resources').then((r)=>r.ok?r.json():Promise.reject()).then((d)=>{
  D=d;
  if(d.role==='teacher'){$('#back').href='/#/t';$('#lead').textContent='Your extra material, sorted by board and type. Open a collection, tick items (or a whole group) and assign them as homework to any class.'}
  else{$('#back').href='/#/s';$('#lead').textContent=(d.board&&d.board!=='Both'?d.board+' class. ':'')+'Extra practice from Haresh Sir. Open in Chrome or Safari; speaking pages need the microphone.'}
  draw();
}).catch(()=>{$('#lead').innerHTML='Please <a href="/">sign in</a> to see the resources.'});
</script></body></html>
