<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IGCSE French Reading · Learn French with Haresh Sir</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="home" class="view">
  <div class="hero">
    <div class="logo">🇫🇷</div>
    <h1>IGCSE French · Reading papers</h1>
    <p>Learn French with Haresh Sir</p>
  </div>
  <div id="paperlist"></div>
  <p class="foot">Tap a paper to open it. Write your answers right on the paper. Tap any word for its meaning, tap 💡 for help.</p>
</div>

<div id="reader" class="view" hidden>
  <header id="top">
    <button id="back" class="ib" title="All papers" aria-label="All papers">‹</button>
    <div class="ttl"><b id="ptitle"></b><small id="psub"></small></div>
    <button id="btnAids" class="tg on" title="Show or hide the learning aids">💡 Aides</button>
    <button id="btnSplit" class="ib" title="Pin the text above the questions">⇅</button>
    <button id="btnNotes" class="ib" title="My saved words">⭐</button>
    <button id="btnLock" class="ib" title="Teacher">🔒</button>
  </header>
  <nav id="chips"></nav>
  <main id="panes">
    <section class="pane" id="paneA"><div class="scroller"></div><div class="zoom"><button data-z="-1">−</button><button data-z="1">+</button></div></section>
    <div id="gap"></div>
    <section class="pane" id="paneB"><div class="scroller"></div><div class="zoom"><button data-z="-1">−</button><button data-z="1">+</button></div></section>
  </main>
  <footer id="sheet"><div id="sheetBody"></div></footer>
</div>

<div id="modal" hidden><div class="card" id="modalCard"></div></div>

<script src="data/gloss.js"></script>
<script src="data/index.js"></script>
<script src="app.js"></script>
</body>
</html>
